# CI de Nível 01 - Disparo Manual através de clique

# nome da pipeline
name: "Execução Manual"

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch

on:
    workflow_dispatch:

#tarefas dentro da pipeline = jobs

jobs:
    #nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        runs-on: ubuntu-latest

        # passos do job
        steps:
            # clone do projeto
            - uses: actions/checkout@v4

            # instalção do node
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x

            # instalação do Yarn
            - name: Instalando Yarn
              run: npm install -g yarn

            #   instalação das dependências
            - name: Instalando dependências
              run: yarn

            # instalação dos Browsers do Playwright
            - name: Instalando Browsers do Playwright
              run: yarn playwright install

            # executar os testes e2e e salvar o output
            - name: Executando testes e2e
              id: e2e
              run: yarn run e2e 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
              continue-on-error: true

            # análise das falhas com IA (GitHub Models) — só executa se algum teste falhar
            - name: Analisando falhas com IA (GitHub Models)
              if: steps.e2e.outcome == 'failure'
              env:
                GITHUB_TOKEN: ${{ github.token }}
              run: |
                python3 - <<'EOF'
                import os, json, urllib.request

                with open("test-output.txt") as f:
                    output = f.read()

                payload = json.dumps({
                    "model": "meta-llama-3.1-70b-instruct",
                    "max_tokens": 1024,
                    "messages": [{
                        "role": "user",
                        "content": f"Analise os resultados de testes E2E com Playwright abaixo e explique em português as falhas encontradas e as possíveis causas:\n\n{output}"
                    }]
                }).encode()

                req = urllib.request.Request(
                    "https://models.inference.ai.azure.com/chat/completions",
                    data=payload,
                    headers={
                        "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                        "content-type": "application/json"
                    }
                )

                with urllib.request.urlopen(req) as res:
                    data = json.loads(res.read())
                    analysis = data["choices"][0]["message"]["content"]

                with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                    f.write("## Análise de Falhas com IA\n\n")
                    f.write(analysis)
                    f.write("\n")

                print(analysis)
                EOF

            # falha a pipeline após a análise, mantendo o comportamento correto de CI
            - name: Verificar resultado dos testes
              if: steps.e2e.outcome == 'failure'
              run: exit 1